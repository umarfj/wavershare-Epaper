[env]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
board_build.arduino.memory_type = qio_opi

; Camera + e-paper firmware (e-paper rewired away from the camera pins, see src/epd.h)
[env:freenove_s3]
build_src_filter = +<*> -<epd_test.cpp>

; Display-only test on the ORIGINAL wiring (SDA13 SCL14 CS15 DC4 RES12 BUSY2).
; Camera is not initialised, so there is no pin conflict.
[env:epd_test]
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env.build_flags}
    -DEPD_MOSI=13
    -DEPD_SCK=14
    -DEPD_CS=15
    -DEPD_DC=4
    -DEPD_RST=12
    -DEPD_BUSY=2
